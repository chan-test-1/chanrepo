<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .pp {
        background-color: lightskyblue;
        width: 100px;
        height: 100px;
      }
      .cc {
        background-color: lightgreen;
        width: 200px;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <div id="styleExample" class="pp">기본 스타일</div>
    <button onclick="changeStyle()">스타일 변경</button>

    <script>
      function changeStyle() {
        const element = document.getElementById("styleExample");

        if (element.className === "pp") {
          element.className = "cc";
          element.innerText = "변경 스타일";
        } else if (element.className === "cc") {
          element.className = "pp";
          element.innerText = "기본 스타일";
        }
      }
      // 퀴즈. 기본 스타일 <-> 변경된 스타일로 스위칭 되도록 기능 변경.
      // head 에 style선언.
      // className줘서 if문으로 컨트롤.
    </script>
  </body>
</html>
