<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--
        document.write 를 사용하여 

        나의 이름은 000이고, 
        나이는 00살, 만 00살입니다.
        document.write 및 with 구문을 사용해서 작성하세요.

        배웠던 예시 ) document.write(`<h3>${prompt("이름을 입력하세요")} 님 환영합니다.<h3>`)

        정답은 50줄
    -->

    <script>
      let myInfo = {
        name: "이지훈",
        age: 30,
        prevAge: 29,
      };

      with (myInfo) {
        document.write(
          `나의이름은 ${name}이고, 나이는 ${age}살, 만 ${prevAge}살 입니다`
        );
      }
    </script>
  </body>
</html>
