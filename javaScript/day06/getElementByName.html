<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>getElementByName</title>
</head>
<body>
    <form>
        <input type="text" name="username" value="Alice">
        <input type="text" name="username" value="Alice">
    </form>

    <script>
        /* getElementsByName 도 여러개 가져오므로 배열 */
        let inputs = document.getElementsByName("username");
        // john 으로 변경.
        inputs[0].value = 'john'
    </script>
</body>
</html>
