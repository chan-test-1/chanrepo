<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreateElement</title>
</head>
<body>
    <script>
        let newDiv = document.createElement("div");
        newDiv.textContent = "이것은 동적으로 생성된 div입니다!";
        document.body.appendChild(newDiv); // 바디 밑에 자식에 생성.

        let newP = document.createElement("p");
        newP.textContent = "이것은 동적으로 생성된 p입니다!";

        newDiv.appendChild(newP);  //div 밑에 

        /*
            quiz
                body > div > p > span 
                이것은 동적으로 생성된 span 입니다.  를 만들어보세요.
                결과는 50줄에.
        */
    </script>
    
</body>
</html>
